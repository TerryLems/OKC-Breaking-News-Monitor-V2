<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#0b0b0b" />

  <title>OKC Breaking News Monitor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .header {
      background: #111111;
      padding: 28px 20px 24px;
      border-bottom: 3px solid #ef6a5b;
    }

    .title {
      margin: 0;
      color: #ff7366;
      font-size: 36px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 22px;
      color: #b7b7b7;
      font-size: 20px;
      line-height: 1.35;
    }

    .alert-button {
      margin-top: 26px;
      width: 100%;
      max-width: 475px;
      border: none;
      border-radius: 13px;
      background: #e86154;
      color: white;
      padding: 20px;
      font-size: 21px;
      font-weight: 900;
      cursor: pointer;
    }

    .status-row {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 900;
      color: #aaff95;
    }

    .status-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e33434;
      box-shadow: 0 0 4px rgba(255, 0, 0, 0.8);
      flex-shrink: 0;
    }

    .incident-count {
      color: #dddddd;
      font-size: 20px;
      white-space: nowrap;
    }

    .refresh-text {
      margin-top: 22px;
      color: #747474;
      font-size: 17px;
      line-height: 1.4;
    }

    .content {
      padding: 18px;
    }

    .error-box {
      display: none;
      background: #401615;
      border: 1px solid #de5547;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      color: #ffbeb7;
      font-size: 17px;
      line-height: 1.4;
    }

    .loading {
      text-align: center;
      color: #aaaaaa;
      font-size: 22px;
      padding: 60px 10px;
    }

    .incident-card {
      background: #151515;
      border: 1px solid #333333;
      border-radius: 13px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.3);
    }

    .priority-p1 {
      border-left: 8px solid #ff2d2d;
      background: #1d0d0d;
    }

    .priority-p2 {
      border-left: 8px solid #ff8c1a;
      background: #1b130b;
    }

    .priority-p3 {
      border-left: 8px solid #ffd34d;
      background: #1b190e;
    }

    .priority-p4 {
      border-left: 6px solid #777777;
      background: #151515;
    }

    .incident-top {
      padding: 16px 16px 12px;
      border-bottom: 1px solid #292929;
    }

    .incident-type {
      color: #ffffff;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
    }

    .incident-time {
      margin-top: 8px;
      color: #ffbf69;
      font-size: 16px;
      font-weight: 700;
    }

    .incident-body {
      padding: 14px 16px 17px;
    }

    .incident-description {
      color: #d9d9d9;
      font-size: 17px;
      line-height: 1.4;
    }

    .incident-location {
      color: #9f9f9f;
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.35;
    }

    .priority-badge {
      display: inline-block;
      margin-bottom: 10px;
      margin-right: 6px;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .badge-p1 {
      background: #ff2d2d;
      color: #ffffff;
    }

    .badge-p2 {
      background: #ff8c1a;
      color: #111111;
    }

    .badge-p3 {
      background: #ffd34d;
      color: #111111;
    }

    .badge-p4 {
      background: #333333;
      color: #bdbdbd;
    }

    .newest-badge {
      display: inline-block;
      margin-bottom: 10px;
      margin-right: 6px;
      padding: 5px 8px;
      border-radius: 5px;
      background: #ff5b4d;
      color: white;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .footer {
      color: #555555;
      text-align: center;
      padding: 20px;
      font-size: 13px;
    }

    @media (min-width: 700px) {
      .header,
      .content {
        max-width: 850px;
        margin-left: auto;
        margin-right: auto;
      }

      .title {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <h1 class="title">
      🚨 OKC BREAKING<br />
      NEWS<br />
      MONITOR
    </h1>

    <div class="subtitle">
      Oklahoma City Public Safety Incident Monitor
    </div>

    <button
      id="enableAlertsButton"
      class="alert-button"
      onclick="enableAlerts()"
    >
      🔊 ENABLE ALERTS
    </button>

    <div class="status-row">

      <div id="status" class="status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">CONNECTING...</span>
      </div>

      <div id="incidentCount" class="incident-count">
        0 incidents
      </div>

    </div>

    <div class="refresh-text">
      Automatically checks for new incidents every 30 seconds
    </div>

  </header>

  <main class="content">

    <div id="errorBox" class="error-box"></div>

    <div id="incidentList">
      <div class="loading">
        Loading OKC incidents...
      </div>
    </div>

  </main>

  <div class="footer">
    Public safety information from Oklahoma City open data.
  </div>

<script>

const FEED_URL =
  "https://utility.arcgis.com/usrsvcs/servers/01c97e2928134efc93157d99f2d23047/rest/services/OpenData/Public_Safety/FeatureServer/0/query";

const REFRESH_INTERVAL = 30000;

let previousIncidentIds = new Set();
let firstLoad = true;
let alertsEnabled = false;


/* =========================================================
   BASIC FIELD HELPERS
   ========================================================= */

function getValue(attributes, possibleNames) {

  for (const name of possibleNames) {

    if (
      attributes[name] !== undefined &&
      attributes[name] !== null &&
      attributes[name] !== ""
    ) {
      return attributes[name];
    }
  }

  return null;
}


function getIncidentId(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "ObjectID",
    "OBJECTID",
    "objectid"
  ]) || JSON.stringify(a);
}


function getIncidentType(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "InfoTitle",
    "Call_Type"
  ]) || "Public Safety Incident";
}


function getIncidentDescription(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "Call_Type",
    "InfoTitle"
  ]) || "No additional description available.";
}


function getIncidentLocation(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "Address",
    "Location"
  ]);
}


/* =========================================================
   DATE / TIME
   OKC FORMAT:
   Sep 28 2026  4:02PM
   ========================================================= */

function getIncidentTimestamp(feature) {

  const a = feature.attributes || {};
  const value = a.Reported_Time;

  if (!value) {
    return 0;
  }

  const text = String(value)
    .replace(/\s+/g, " ")
    .trim();

  const match = text.match(
    /^([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i
  );

  if (!match) {
    console.log("Could not read Reported_Time:", value);
    return 0;
  }

  const months = {
    Jan: 0,
    Feb: 1,
    Mar: 2,
    Apr: 3,
    May: 4,
    Jun: 5,
    Jul: 6,
    Aug: 7,
    Sep: 8,
    Oct: 9,
    Nov: 10,
    Dec: 11
  };

  const monthName =
    match[1].charAt(0).toUpperCase() +
    match[1].slice(1).toLowerCase();

  const month = months[monthName];
  const day = Number(match[2]);
  const year = Number(match[3]);

  let hour = Number(match[4]);
  const minute = Number(match[5]);
  const ampm = match[6].toUpperCase();

  if (ampm === "PM" && hour !== 12) {
    hour += 12;
  }

  if (ampm === "AM" && hour === 12) {
    hour = 0;
  }

  return new Date(
    year,
    month,
    day,
    hour,
    minute,
    0,
    0
  ).getTime();
}


function formatIncidentDate(timestamp) {

  if (!timestamp) {
    return "Date/time unavailable";
  }

  const date = new Date(timestamp);

  if (Number.isNaN(date.getTime())) {
    return "Date/time unavailable";
  }

  return date.toLocaleString("en-US", {
    weekday: "short",
    month: "short",
    day: "numeric",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}


/* =========================================================
   HTML SAFETY
   ========================================================= */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   PRIORITY RANKING
   P1 = MOST URGENT
   P4 = ROUTINE
   ========================================================= */

function getPriority(feature) {

  const text =
    (
      getIncidentType(feature) +
      " " +
      getIncidentDescription(feature)
    ).toLowerCase();


  const p1Words = [
    "shooting",
    "shots fired",
    "person shot",
    "stabbing",
    "person stabbed",
    "structure fire",
    "house fire",
    "apartment fire",
    "commercial fire",
    "explosion",
    "armed subject",
    "armed robbery",
    "homicide",
    "officer down",
    "officer involved",
    "active shooter"
  ];


  const p2Words = [
    "injury accident",
    "major accident",
    "major crash",
    "vehicle fire",
    "rescue",
    "traffic/trans. acc. fr",
    "traffic accident with injury",
    "rollover",
    "entrapment"
  ];


  const p3Words = [
    "alarm fire",
    "fire alarm",
    "suspicious",
    "disturbance",
    "burglary",
    "welfare check",
    "medical",
    "traffic hazard",
    "reckless driver"
  ];


  if (p1Words.some(word => text.includes(word))) {
    return {
      level: 1,
      code: "P1",
      label: "CRITICAL"
    };
  }


  if (p2Words.some(word => text.includes(word))) {
    return {
      level: 2,
      code: "P2",
      label: "HIGH"
    };
  }


  if (p3Words.some(word => text.includes(word))) {
    return {
      level: 3,
      code: "P3",
      label: "MEDIUM"
    };
  }


  return {
    level: 4,
    code: "P4",
    label: "ROUTINE"
  };
}


/* =========================================================
   ALERT SOUND
   ONLY P1 INCIDENTS SOUND
   ========================================================= */

function playAlertSound() {

  if (!alertsEnabled) {
    return;
  }

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContextClass();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.frequency.value = 880;
    oscillator.type = "sine";

    gain.gain.setValueAtTime(
      0.15,
      audioContext.currentTime
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.35
    );

  } catch (error) {

    console.log(
      "Unable to play alert:",
      error
    );
  }
}


function enableAlerts() {

  alertsEnabled = true;

  const button =
    document.getElementById(
      "enableAlertsButton"
    );

  button.innerHTML =
    "🔊 ALERTS ENABLED";

  button.style.background =
    "#278f4b";

  playAlertSound();
}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(type) {

  const statusText =
    document.getElementById(
      "statusText"
    );

  const dot =
    document.getElementById(
      "statusDot"
    );


  if (type === "live") {

    statusText.textContent =
      "LIVE";

    statusText.style.color =
      "#aaff95";

    dot.style.background =
      "#34c759";
  }


  if (type === "loading") {

    statusText.textContent =
      "CHECKING...";

    statusText.style.color =
      "#ffcf66";

    dot.style.background =
      "#ffb020";
  }


  if (type === "error") {

    statusText.textContent =
      "FEED ERROR";

    statusText.style.color =
      "#ff8d84";

    dot.style.background =
      "#e33434";
  }
}


function showError(message) {

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display =
    "block";

  box.innerHTML =
    "<strong>Feed error:</strong><br>" +
    escapeHTML(message);
}


function hideError() {

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display =
    "none";

  box.innerHTML =
    "";
}


/* =========================================================
   INCIDENT CARD
   ========================================================= */

function createIncidentCard(
  feature,
  isNewest
) {

  const type =
    getIncidentType(feature);

  const description =
    getIncidentDescription(feature);

  const location =
    getIncidentLocation(feature);

  const timestamp =
    getIncidentTimestamp(feature);

  const formattedTime =
    formatIncidentDate(timestamp);

  const priority =
    getPriority(feature);


  let priorityClass = "";
  let badgeClass = "";


  if (priority.level === 1) {
    priorityClass = "priority-p1";
    badgeClass = "badge-p1";
  }

  else if (priority.level === 2) {
    priorityClass = "priority-p2";
    badgeClass = "badge-p2";
  }

  else if (priority.level === 3) {
    priorityClass = "priority-p3";
    badgeClass = "badge-p3";
  }

  else {
    priorityClass = "priority-p4";
    badgeClass = "badge-p4";
  }


  let newestBadge = "";

  if (isNewest) {
    newestBadge =
      '<span class="newest-badge">' +
      "🔥 NEWEST" +
      "</span>";
  }


  const priorityBadge =
    '<span class="priority-badge ' +
    badgeClass +
    '">' +
    priority.code +
    " — " +
    priority.label +
    "</span>";


  let locationHTML = "";

  if (location) {

    locationHTML =
      '<div class="incident-location">' +
      "📍 " +
      escapeHTML(location) +
      "</div>";
  }


  return `
    <div class="incident-card ${priorityClass}">

      <div class="incident-top">

        <div>
          ${newestBadge}
          ${priorityBadge}
        </div>

        <div class="incident-type">
          ${escapeHTML(type)}
        </div>

        <div class="incident-time">
          🕒 ${escapeHTML(formattedTime)}
        </div>

      </div>

      <div class="incident-body">

        <div class="incident-description">
          ${escapeHTML(description)}
        </div>

        ${locationHTML}

      </div>

    </div>
  `;
}


/* =========================================================
   SORTING
   PRIORITY FIRST
   THEN NEWEST TIME
   ========================================================= */

function renderIncidents(features) {

  const container =
    document.getElementById(
      "incidentList"
    );


  features.sort((a, b) => {

    const priorityA =
      getPriority(a).level;

    const priorityB =
      getPriority(b).level;


    if (priorityA !== priorityB) {

      return priorityA - priorityB;
    }


    return (
      getIncidentTimestamp(b) -
      getIncidentTimestamp(a)
    );
  });


  document.getElementById(
    "incidentCount"
  ).textContent =
    features.length +
    (
      features.length === 1
        ? " incident"
        : " incidents"
    );


  if (features.length === 0) {

    container.innerHTML =
      '<div class="loading">' +
      "No incidents currently available." +
      "</div>";

    return;
  }


  let html = "";


  features.forEach(
    (feature, index) => {

      html +=
        createIncidentCard(
          feature,
          index === 0
        );
    }
  );


  container.innerHTML =
    html;
}


/* =========================================================
   NEW INCIDENT ALERT CHECK
   SOUND ONLY FOR NEW P1 CALLS
   ========================================================= */

function checkForAlerts(features) {

  const currentIds =
    new Set();


  features.forEach(feature => {

    const id =
      String(
        getIncidentId(feature)
      );

    currentIds.add(id);

    const priority =
      getPriority(feature);


    if (
      !firstLoad &&
      !previousIncidentIds.has(id) &&
      priority.level === 1
    ) {

      playAlertSound();
    }
  });


  previousIncidentIds =
    currentIds;

  firstLoad =
    false;
}


/* =========================================================
   LOAD FEED
   ========================================================= */

async function loadIncidents() {

  setStatus("loading");


  const params =
    new URLSearchParams({

      where: "1=1",

      outFields: "*",

      returnGeometry: "false",

      f: "json",

      resultRecordCount: "100",

      orderByFields:
        "ObjectID DESC"
    });


  const requestURL =
    FEED_URL +
    "?" +
    params.toString();


  try {

    const response =
      await fetch(
        requestURL,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "OKC server returned HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    if (data.error) {

      throw new Error(
        data.error.message ||
        "ArcGIS returned an error."
      );
    }


    if (
      !data.features ||
      !Array.isArray(data.features)
    ) {

      throw new Error(
        "The OKC feed did not return incident records."
      );
    }


    hideError();

    checkForAlerts(
      data.features
    );

    renderIncidents(
      data.features
    );

    setStatus("live");


  } catch (error) {

    console.error(
      "Feed error:",
      error
    );

    setStatus("error");

    showError(
      error.message
    );

    document.getElementById(
      "incidentList"
    ).innerHTML =
      '<div class="loading">' +
      "Unable to load OKC incidents." +
      "</div>";
  }
}


/* =========================================================
   START
   ========================================================= */

loadIncidents();

setInterval(
  loadIncidents,
  REFRESH_INTERVAL
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>OKC Breaking News Monitor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .header {
      background: #111;
      padding: 24px 20px;
      border-bottom: 3px solid #ef5350;
    }

    h1 {
      margin: 0;
      color: #ff5a4f;
      font-size: 34px;
      line-height: 1.05;
      font-weight: 900;
    }

    .subtitle {
      color: #aaa;
      font-size: 18px;
      margin-top: 12px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    #connectionStatus {
      font-size: 18px;
      font-weight: bold;
      color: #7cff7c;
    }

    #incidentCount {
      font-size: 18px;
      color: #ddd;
    }

    #enableAlerts {
      margin-top: 18px;
      padding: 13px 18px;
      background: #ff453a;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #enableAlerts.enabled {
      background: #23a455;
    }

    .refresh-info {
      font-size: 13px;
      color: #777;
      margin-top: 12px;
    }

    #message {
      text-align: center;
      padding: 55px 20px;
      color: #aaa;
      font-size: 21px;
    }

    #incidentList {
      padding: 14px;
    }

    .incident {
      background: #151515;
      border: 1px solid #292929;
      border-left: 5px solid #555;
      border-radius: 10px;
      margin-bottom: 12px;
      padding: 16px;
    }

    .incident.priority {
      background: #211010;
      border-left-color: #ff3b30;
    }

    .incident.new-incident {
      animation: flash 1.5s ease-in-out 2;
    }

    @keyframes flash {
      0% {
        background: #4a1111;
      }

      50% {
        background: #151515;
      }

      100% {
        background: #4a1111;
      }
    }

    .incident-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .incident-title {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }

    .priority-label {
      background: #ff3b30;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 8px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .incident-description {
      color: #ccc;
      margin-top: 9px;
      font-size: 16px;
      line-height: 1.4;
    }

    .incident-location {
      color: #ffcc66;
      margin-top: 10px;
      font-size: 15px;
      font-weight: bold;
    }

    .incident-time {
      color: #888;
      margin-top: 9px;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      padding: 30px 15px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .header {
        padding: 22px 18px;
      }

      .subtitle {
        font-size: 16px;
      }

      .incident-title {
        font-size: 18px;
      }

      #incidentList {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <h1>🚨 OKC BREAKING NEWS<br>MONITOR</h1>

      <div class="subtitle">
        Oklahoma City Public Safety Incident Monitor
      </div>

      <button id="enableAlerts">
        🔊 ENABLE ALERTS
      </button>

      <div class="status-row">
        <div id="connectionStatus">
          🟡 CONNECTING
        </div>

        <div id="incidentCount">
          0 incidents
        </div>
      </div>

      <div class="refresh-info">
        Automatically checks for new incidents every 30 seconds
      </div>

    </div>

    <div id="message">
      Loading OKC incidents...
    </div>

    <div id="incidentList"></div>

    <div class="footer">
      Public safety information may change as incidents develop.
    </div>

  </div>


  <script>

    /*
    ================================================
    OKC BREAKING NEWS MONITOR
    ================================================
    */

    const API_URL =
      "https://utility.arcgis.com/usrsvcs/servers/01c97e2928134efc93157d99f2d23047/rest/services/OpenData/Public_Safety/FeatureServer/0/query";

    const REFRESH_INTERVAL = 30000;

    let firstLoad = true;

    let knownBreakingIds = new Set();

    let alertsEnabled = false;

    let audioContext = null;


    /*
    ================================================
    HTML ELEMENTS
    ================================================
    */

    const incidentList =
      document.getElementById("incidentList");

    const incidentCount =
      document.getElementById("incidentCount");

    const connectionStatus =
      document.getElementById("connectionStatus");

    const message =
      document.getElementById("message");

    const enableAlertsButton =
      document.getElementById("enableAlerts");


    /*
    ================================================
    ENABLE SOUND
    ================================================
    */

    enableAlertsButton.addEventListener("click", async function () {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!audioContext) {
          audioContext = new AudioContext();
        }

        if (audioContext.state === "suspended") {
          await audioContext.resume();
        }

        alertsEnabled = true;

        enableAlertsButton.classList.add("enabled");

        enableAlertsButton.textContent =
          "🔊 ALERTS ENABLED";

        playAlertSound();

      } catch (error) {

        console.error("Audio error:", error);

        alert(
          "Your browser could not enable sound alerts."
        );

      }

    });


    /*
    ================================================
    ALERT SOUND
    ================================================
    */

    function playAlertSound() {

      if (!alertsEnabled || !audioContext) {
        return;
      }

      const now = audioContext.currentTime;

      function tone(
        frequency,
        start,
        duration
      ) {

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.value =
          frequency;

        gain.gain.setValueAtTime(
          0.0001,
          now + start
        );

        gain.gain.exponentialRampToValueAtTime(
          0.6,
          now + start + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + start + duration
        );

        oscillator.connect(gain);

        gain.connect(
          audioContext.destination
        );

        oscillator.start(
          now + start
        );

        oscillator.stop(
          now + start + duration
        );

      }

      tone(880, 0, 0.18);

      tone(880, 0.27, 0.18);

      tone(1100, 0.54, 0.35);

    }


    /*
    ================================================
    HIGH PRIORITY INCIDENT WORDS
    ================================================
    */

    const HIGH_PRIORITY_WORDS = [

      "shooting",
      "shots fired",
      "structure fire",
      "house fire",
      "apartment fire",
      "commercial fire",
      "building fire",
      "working fire",
      "explosion",
      "bomb",
      "stabbing",
      "armed robbery",
      "armed subject",
      "active shooter",
      "officer down",
      "officer involved",
      "officer-involved",
      "fatality",
      "fatal",
      "homicide",
      "murder",
      "kidnapping",
      "hostage",
      "pursuit",
      "vehicle pursuit",
      "water rescue",
      "drowning",
      "aircraft",
      "plane crash",
      "train accident",
      "hazmat",
      "hazardous materials"

    ];


    /*
    ================================================
    DETERMINE PRIORITY
    ================================================
    */

    function isHighPriority(text) {

      const lower =
        String(text || "").toLowerCase();

      return HIGH_PRIORITY_WORDS.some(
        word => lower.includes(word)
      );

    }


    /*
    ================================================
    FIND FIELD BY POSSIBLE NAMES
    ================================================
    */

    function getField(
      attributes,
      possibleNames
    ) {

      if (!attributes) {
        return "";
      }

      const keys =
        Object.keys(attributes);

      for (const possible of possibleNames) {

        const matchingKey =
          keys.find(
            key =>
              key.toLowerCase() ===
              possible.toLowerCase()
          );

        if (
          matchingKey &&
          attributes[matchingKey] !== null &&
          attributes[matchingKey] !== undefined
        ) {

          return attributes[matchingKey];

        }

      }

      return "";

    }


    /*
    ================================================
    ESCAPE HTML
    ================================================
    */

    function escapeHTML(value) {

      return String(value || "")

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }


    /*
    ================================================
    FORMAT TIME
    ================================================
    */

    function formatTime(value) {

      if (!value) {
        return "";
      }

      try {

        let date;

        if (
          typeof value === "number" ||
          /^\d{10,13}$/.test(String(value))
        ) {

          date =
            new Date(Number(value));

        } else {

          date =
            new Date(value);

        }

        if (
          isNaN(date.getTime())
        ) {

          return String(value);

        }

        return date.toLocaleString(
          "en-US",
          {
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit"
          }
        );

      } catch {

        return String(value);

      }

    }


    /*
    ================================================
    LOAD INCIDENTS
    ================================================
    */

    async function loadIncidents() {

      connectionStatus.innerHTML =
        "🟡 CHECKING";

      try {

        const params =
          new URLSearchParams({

            where: "1=1",

            outFields: "*",

            returnGeometry: "false",

            orderByFields:
              "ObjectID DESC",

            resultRecordCount:
              "100",

            f: "json"

          });


        const response =
          await fetch(
            API_URL +
            "?" +
            params.toString(),
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (data.error) {

          console.error(
            "ArcGIS error:",
            data.error
          );

          throw new Error(
            data.error.message ||
            "ArcGIS API error"
          );

        }


        const features =
          Array.isArray(data.features)
            ? data.features
            : [];


        connectionStatus.innerHTML =
          "🟢 LIVE";


        renderIncidents(
          features
        );


      } catch (error) {

        console.error(
          "Feed error:",
          error
        );

        connectionStatus.innerHTML =
          "🔴 CONNECTION ERROR";

        message.style.display =
          "block";

        message.innerHTML =
          "Unable to load OKC incidents.<br><br>" +
          "<span style='font-size:14px;color:#777'>" +
          "The monitor will automatically try again." +
          "</span>";

      }

    }


    /*
    ================================================
    RENDER INCIDENTS
    ================================================
    */

    function renderIncidents(features) {

      incidentCount.textContent =
        features.length +
        " incidents";


      if (features.length === 0) {

        incidentList.innerHTML =
          "";

        message.style.display =
          "block";

        message.textContent =
          "No incidents currently returned by the feed.";

        return;

      }


      message.style.display =
        "none";


      let html = "";

      let breakingAlertDetected =
        false;


      const currentIds =
        new Set();


      features.forEach(
        (feature, index) => {

          const a =
            feature.attributes || {};


          const id =
            getField(
              a,
              [
                "ObjectID",
                "OBJECTID",
                "objectid"
              ]
            ) ||
            index;


          currentIds.add(
            String(id)
          );


          /*
          CALL TYPE
          */

          const title =
            getField(
              a,
              [
                "InfoTitle",
                "Call_Type",
                "CallType",
                "IncidentType",
                "Incident_Type",
                "Description",
                "Type"
              ]
            ) ||
            "Public Safety Incident";


          /*
          DESCRIPTION
          */

          let description =
            getField(
              a,
              [
                "Call_Type",
                "Description",
                "IncidentDescription",
                "Nature",
                "Comments"
              ]
            );


          if (
            String(description) ===
            String(title)
          ) {

            description = "";

          }


          /*
          LOCATION
          */

          const location =
            getField(
              a,
              [
                "Location",
                "Address",
                "Block",
                "Street",
                "IncidentLocation",
                "LocationText"
              ]
            );


          /*
          DATE/TIME
          */

          const dateValue = attributes.Reported_Time;

              ${dateValue ? `
  <div class="incident-time">
    🕒 ${formatTime(dateValue)}
  </div>
` : ""}
          const searchableText =
            title +
            " " +
            description;

          const priority =
            isHighPriority(
              searchableText
            );

          const isNew =
            !firstLoad &&
            !knownBreakingIds.has(
              String(id)
            );

          if (
            isNew &&
            priority
          ) {

            breakingAlertDetected =
              true;

          }

          html += `

            <div class="
              incident
              ${priority ? "priority" : ""}
              ${isNew ? "new-incident" : ""}
            ">

              <div class="incident-top">

                <div class="incident-title">

                  ${escapeHTML(title)}

                </div>

                ${
                  priority
                    ? `<div class="priority-label">
                         BREAKING
                       </div>`
                    : ""
                }

              </div>

              ${
                description
                  ? `<div class="incident-description">
                       ${escapeHTML(description)}
                     </div>`
                  : ""
              }

              ${
                location
                  ? `<div class="incident-location">
                       📍 ${escapeHTML(location)}
                     </div>`
                  : ""
              }

              ${
                dateValue
                  ? `<div class="incident-time">
                       🕒 ${escapeHTML(
                         formatTime(
                           dateValue
                         )
                       )}
                     </div>`
                  : ""
              }

            </div>

          `;

        }
      );


      incidentList.innerHTML =
        html;


      /*
      SOUND ONLY FOR NEW
      HIGH-PRIORITY INCIDENTS
      AFTER INITIAL PAGE LOAD
      */

      if (
        breakingAlertDetected &&
        alertsEnabled
      ) {

        playAlertSound();

      }


      knownBreakingIds =
        currentIds;


      firstLoad =
        false;

    }


    /*
    ================================================
    START MONITOR
    ================================================
    */

    loadIncidents();


    /*
    CHECK EVERY 30 SECONDS
    */

    setInterval(
    loadIncidents,
    30000
);

function formatTime(value) {
    if (!value) return "";

    const date = new Date(value);

    if (isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
    });
}

  </script>

</body>
</html>

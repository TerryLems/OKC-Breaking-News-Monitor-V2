    .priority-p2 {
      border-left: 8px solid #ff8c1a;

    .priority-p3 {

    .incident-body {
      padding: 14px 16px 17px;

    .incident-description {
      color: #d9d9d9;

    .badge-p1 {
      background: #ff2d2d;

    .badge-p2 {

      margin-bottom: 10px;

      letter-spacing: 0.5px;
    }

      letter-spacing: 0.3px;

      transform: scale(0.98);
    }

    .footer {
      color: #555555;
      text-align: center;

    @media (min-width: 700px) {
      .header,

        margin-left: auto;
        margin-right: auto;

      .title {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <h1 class="title">
      🚨 OKC BREAKING<br />
      NEWS<br />
      MONITOR
    </h1>

    <div class="subtitle">
      Oklahoma City Public Safety Incident Monitor
    </div>

    <button
      id="enableAlertsButton"
      class="alert-button"
      onclick="enableAlerts()"
    >
      🔊 ENABLE ALERTS
    </button>

    <div class="status-row">

      <div id="status" class="status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">CONNECTING...</span>
      </div>

      <div id="incidentCount" class="incident-count">
        0 incidents
      </div>

    </div>

    <div class="refresh-text">
      Showing incidents reported within the last 24 hours.
      Automatically checks every 30 seconds.
    </div>

  </header>

  <main class="content">

    <div id="errorBox" class="error-box"></div>

    <div id="incidentList">
      <div class="loading">
        Loading OKC incidents...
      </div>
    </div>

  </main>

  <div class="footer">
    Public safety information from Oklahoma City open data.
  </div>

<script>

const FEED_URL =
  "https://utility.arcgis.com/usrsvcs/servers/01c97e2928134efc93157d99f2d23047/rest/services/OpenData/Public_Safety/FeatureServer/0/query";

const REFRESH_INTERVAL = 30000;

const MAX_INCIDENT_AGE =
  24 * 60 * 60 * 1000;

let previousIncidentIds = new Set();

let firstLoad = true;

let alertsEnabled = false;


/* =========================================================
   BASIC FIELD HELPERS
   ========================================================= */

function getValue(attributes, possibleNames) {

  for (const name of possibleNames) {

    if (
      attributes[name] !== undefined &&
      attributes[name] !== null &&
      attributes[name] !== ""
    ) {
      return attributes[name];
    }
  }

  return null;
}


function getIncidentId(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "ObjectID",
    "OBJECTID",
    "objectid"
  ]) || JSON.stringify(a);
}


function getIncidentType(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "InfoTitle",
    "Call_Type"
  ]) || "Public Safety Incident";
}


function getIncidentDescription(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "Call_Type",
    "InfoTitle"
  ]) || "No additional description available.";
}


function getIncidentLocation(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "Address",
    "Location"
  ]);
}


/* =========================================================
   DATE / TIME
   Example:
   Sep 28 2026  4:02PM
   ========================================================= */

function getIncidentTimestamp(feature) {

  const a = feature.attributes || {};

  const value = a.Reported_Time;

  if (!value) {
    return 0;
  }

  const text = String(value)
    .replace(/\s+/g, " ")
    .trim();

  const match = text.match(
    /^([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i
  );

  if (!match) {

    console.log(
      "Could not read Reported_Time:",
      value
    );

    return 0;
  }

  const months = {
    Jan: 0,
    Feb: 1,
    Mar: 2,
    Apr: 3,
    May: 4,
    Jun: 5,
    Jul: 6,
    Aug: 7,
    Sep: 8,
    Oct: 9,
    Nov: 10,
    Dec: 11
  };

  const monthName =
    match[1].charAt(0).toUpperCase() +
    match[1].slice(1).toLowerCase();

  const month =
    months[monthName];

  const day =
    Number(match[2]);

  const year =
    Number(match[3]);

  let hour =
    Number(match[4]);

  const minute =
    Number(match[5]);

  const ampm =
    match[6].toUpperCase();


  if (
    ampm === "PM" &&
    hour !== 12
  ) {
    hour += 12;
  }


  if (
    ampm === "AM" &&
    hour === 12
  ) {
    hour = 0;
  }


  return new Date(
    year,
    month,
    day,
    hour,
    minute,
    0,
    0
  ).getTime();
}


function formatIncidentDate(timestamp) {

  if (!timestamp) {
    return "Date/time unavailable";
  }

  const date =
    new Date(timestamp);

  return date.toLocaleString(
    "en-US",
    {
      weekday: "short",
      month: "short",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );
}


/* =========================================================
   HOW LONG AGO
   ========================================================= */

function getIncidentAge(timestamp) {

  if (!timestamp) {
    return "";
  }

  const difference =
    Date.now() - timestamp;

  if (difference < 0) {
    return "Reported just now";
  }

  const minutes =
    Math.floor(
      difference / 60000
    );

  if (minutes < 1) {
    return "Reported just now";
  }

  if (minutes === 1) {
    return "Reported 1 minute ago";
  }

  if (minutes < 60) {
    return (
      "Reported " +
      minutes +
      " minutes ago"
    );
  }

  const hours =
    Math.floor(
      minutes / 60
    );

  if (hours === 1) {
    return "Reported 1 hour ago";
  }

  return (
    "Reported " +
    hours +
    " hours ago"
  );
}


/* =========================================================
   HTML SAFETY
   ========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   PRIORITY RANKING
   ========================================================= */

function getPriority(feature) {

  const text =
    (
      getIncidentType(feature) +
      " " +
      getIncidentDescription(feature)
    ).toLowerCase();


  /*
    IMPORTANT:
    Check NON-INJURY before checking "injury accident".
    Otherwise "non-injury accident" contains
    the words "injury accident".
  */

  if (
    text.includes("non-injury") ||
    text.includes("non injury")
  ) {

    return {
      level: 4,
      code: "P4",
      label: "ROUTINE"
    };
  }


  const p1Words = [
    "active shooter",
    "shooting",
    "shots fired",
    "person shot",
    "stabbing",
    "person stabbed",
    "structure fire",
    "house fire",
    "apartment fire",
    "commercial fire",
    "explosion",
    "armed subject",
    "armed robbery",
    "homicide",
    "officer down",
    "officer involved"
  ];


  const p2Words = [
    "injury accident",
    "traffic accident with injury",
    "major accident",
    "major crash",
    "vehicle fire",
    "rescue",
    "entrapment",
    "rollover",
    "traffic/trans. acc. fr"
  ];


  const p3Words = [
    "alarm fire",
    "fire alarm",
    "alarm fire auto",
    "suspicious",
    "disturbance",
    "burglary",
    "welfare check",
    "traffic hazard",
    "reckless driver"
  ];


  if (
    p1Words.some(
      word =>
        text.includes(word)
    )
  ) {

    return {
      level: 1,
      code: "P1",
      label: "CRITICAL"
    };
  }


  if (
    p2Words.some(
      word =>
        text.includes(word)
    )
  ) {

    return {
      level: 2,
      code: "P2",
      label: "HIGH"
    };
  }


  if (
    p3Words.some(
      word =>
        text.includes(word)
    )
  ) {

    return {
      level: 3,
      code: "P3",
      label: "MEDIUM"
    };
  }


  return {
    level: 4,
    code: "P4",
    label: "ROUTINE"
  };
}


/* =========================================================
   MAP LINK
   ========================================================= */

function getMapURL(location) {

  if (!location) {
    return "#";
  }

  /*
    We add Oklahoma City, Oklahoma so intersections
    are more likely to resolve locally.
  */

  const search =
    location +
    ", Oklahoma City, Oklahoma";

  return (
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(search)
  );
}


/* =========================================================
   ALERT SOUND
   ========================================================= */

function playAlertSound() {

  if (!alertsEnabled) {
    return;
  }

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContextClass();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.frequency.value =
      880;

    oscillator.type =
      "sine";

    gain.gain.setValueAtTime(
      0.15,
      audioContext.currentTime
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime +
      0.35
    );

  } catch (error) {

    console.log(
      "Unable to play alert:",
      error
    );
  }
}


function enableAlerts() {

  alertsEnabled = true;

  const button =
    document.getElementById(
      "enableAlertsButton"
    );

  button.innerHTML =
    "🔊 ALERTS ENABLED";

  button.style.background =
    "#278f4b";

  playAlertSound();
}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(type) {

  const statusText =
    document.getElementById(
      "statusText"
    );

  const dot =
    document.getElementById(
      "statusDot"
    );


  if (type === "live") {

    statusText.textContent =
      "LIVE";

    statusText.style.color =
      "#aaff95";

    dot.style.background =
      "#34c759";
  }


  if (type === "loading") {

    statusText.textContent =
      "CHECKING...";

    statusText.style.color =
      "#ffcf66";

    dot.style.background =
      "#ffb020";
  }


  if (type === "error") {

    statusText.textContent =
      "FEED ERROR";

    statusText.style.color =
      "#ff8d84";

    dot.style.background =
      "#e33434";
  }
}


function showError(message) {

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display =
    "block";

  box.innerHTML =
    "<strong>Feed error:</strong><br>" +
    escapeHTML(message);
}


function hideError() {

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display =
    "none";

  box.innerHTML =
    "";
}


/* =========================================================
   INCIDENT CARD
   ========================================================= */

function createIncidentCard(
  feature,
  isNewest
) {

  const type =
    getIncidentType(feature);

  const description =
    getIncidentDescription(feature);

  const location =
    getIncidentLocation(feature);

  const timestamp =
    getIncidentTimestamp(feature);

  const formattedTime =
    formatIncidentDate(timestamp);

  const incidentAge =
    getIncidentAge(timestamp);

  const priority =
    getPriority(feature);


  let priorityClass = "";

  let badgeClass = "";


  if (priority.level === 1) {

    priorityClass =
      "priority-p1";

    badgeClass =
      "badge-p1";
  }

  else if (
    priority.level === 2
  ) {

    priorityClass =
      "priority-p2";

    badgeClass =
      "badge-p2";
  }

  else if (
    priority.level === 3
  ) {

    priorityClass =
      "priority-p3";

    badgeClass =
      "badge-p3";
  }

  else {

    priorityClass =
      "priority-p4";

    badgeClass =
      "badge-p4";
  }


  let newestBadge = "";


  if (isNewest) {

    newestBadge =
      '<span class="newest-badge">' +
      "🔥 NEWEST" +
      "</span>";
  }


  const priorityBadge =
    '<span class="priority-badge ' +
    badgeClass +
    '">' +
    priority.code +
    " — " +
    priority.label +
    "</span>";


  let locationHTML = "";


  if (location) {

    const mapURL =
      getMapURL(location);


    locationHTML =
      '<div class="incident-location">' +
      "📍 " +
      escapeHTML(location) +
      "</div>" +

      '<a class="map-button" ' +
      'href="' +
      escapeHTML(mapURL) +
      '" ' +
      'target="_blank" ' +
      'rel="noopener noreferrer">' +
      "🗺️ VIEW SCENE AREA" +
      "</a>";
  }


  return `

    <div class="incident-card ${priorityClass}">

      <div class="incident-top">

        <div>
          ${newestBadge}
          ${priorityBadge}
        </div>

        <div class="incident-type">
          ${escapeHTML(type)}
        </div>

        <div class="incident-time">
          🕒 ${escapeHTML(formattedTime)}
        </div>

        <div class="incident-age">
          ${escapeHTML(incidentAge)}
        </div>

      </div>

      <div class="incident-body">

        <div class="incident-description">
          ${escapeHTML(description)}
        </div>

        ${locationHTML}

      </div>

    </div>

  `;
}


/* =========================================================
   FILTER TO LAST 24 HOURS
   ========================================================= */

function filterRecentIncidents(features) {

  const now =
    Date.now();


  return features.filter(
    feature => {

      const timestamp =
        getIncidentTimestamp(
          feature
        );


      if (!timestamp) {

        return false;
      }


      const age =
        now - timestamp;


      return (
        age >= 0 &&
        age <= MAX_INCIDENT_AGE
      );
    }
  );
}


/* =========================================================
   SORT:
   PRIORITY FIRST
   THEN NEWEST WITHIN PRIORITY
   ========================================================= */

function sortIncidents(features) {

  features.sort(
    (a, b) => {

      const priorityA =
        getPriority(a).level;

      const priorityB =
        getPriority(b).level;


      if (
        priorityA !==
        priorityB
      ) {

        return (
          priorityA -
          priorityB
        );
      }


      return (
        getIncidentTimestamp(b) -
        getIncidentTimestamp(a)
      );
    }
  );


  return features;
}


/* =========================================================
   RENDER INCIDENTS
   ========================================================= */

function renderIncidents(features) {

  const container =
    document.getElementById(
      "incidentList"
    );


  let recentFeatures =
    filterRecentIncidents(
      features
    );


  recentFeatures =
    sortIncidents(
      recentFeatures
    );


  document.getElementById(
    "incidentCount"
  ).textContent =
    recentFeatures.length +
    (
      recentFeatures.length === 1
        ? " incident"
        : " incidents"
    );


  if (
    recentFeatures.length === 0
  ) {

    container.innerHTML =
      '<div class="loading">' +
      "No incidents reported within the last 24 hours." +
      "</div>";

    return;
  }


  /*
    Find the ACTUAL newest incident,
    regardless of priority level.
  */

  let newestIncident =
    recentFeatures[0];


  for (
    const feature of
    recentFeatures
  ) {

    if (
      getIncidentTimestamp(feature) >
      getIncidentTimestamp(
        newestIncident
      )
    ) {

      newestIncident =
        feature;
    }
  }


  const newestId =
    String(
      getIncidentId(
        newestIncident
      )
    );


  let html = "";


  recentFeatures.forEach(
    feature => {

      const thisId =
        String(
          getIncidentId(feature)
        );


      html +=
        createIncidentCard(
          feature,
          thisId === newestId
        );
    }
  );


  container.innerHTML =
    html;
}


/* =========================================================
   NEW INCIDENT ALERT CHECK
   P1 ONLY
   ========================================================= */

function checkForAlerts(features) {

  const recentFeatures =
    filterRecentIncidents(
      features
    );


  const currentIds =
    new Set();


  recentFeatures.forEach(
    feature => {

      const id =
        String(
          getIncidentId(feature)
        );


      currentIds.add(id);


      const priority =
        getPriority(feature);


      if (
        !firstLoad &&
        !previousIncidentIds.has(id) &&
        priority.level === 1
      ) {

        playAlertSound();
      }
    }
  );


  previousIncidentIds =
    currentIds;


  firstLoad =
    false;
}


/* =========================================================
   LOAD OKC FEED
   ========================================================= */

async function loadIncidents() {

  setStatus("loading");


  const params =
    new URLSearchParams({

      where: "1=1",

      outFields: "*",

      returnGeometry:
        "false",

      f: "json",

      resultRecordCount:
        "100",

      orderByFields:
        "ObjectID DESC"
    });


  const requestURL =
    FEED_URL +
    "?" +
    params.toString();


  try {

    const response =
      await fetch(
        requestURL,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "OKC server returned HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    if (data.error) {

      throw new Error(
        data.error.message ||
        "ArcGIS returned an error."
      );
    }


    if (
      !data.features ||
      !Array.isArray(
        data.features
      )
    ) {

      throw new Error(
        "The OKC feed did not return incident records."
      );
    }


    hideError();


    checkForAlerts(
      data.features
    );


    renderIncidents(
      data.features
    );


    setStatus(
      "live"
    );


  } catch (error) {

    console.error(
      "Feed error:",
      error
    );


    setStatus(
      "error"
    );


    showError(
      error.message
    );


    document.getElementById(
      "incidentList"
    ).innerHTML =
      '<div class="loading">' +
      "Unable to load OKC incidents." +
      "</div>";
  }
}


/* =========================================================
   START
   ========================================================= */

loadIncidents();


setInterval(
  loadIncidents,
  REFRESH_INTERVAL
);

</script>

</body>
</html>

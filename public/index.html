<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>OKC Breaking News Monitor</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.header {
  background: #111;
  padding: 28px 20px 24px;
  border-bottom: 3px solid #f05b50;
}

h1 {
  margin: 0;
  color: #ff6b61;
  font-size: 38px;
  line-height: 1.05;
  font-weight: 900;
}

.subtitle {
  margin-top: 20px;
  font-size: 20px;
  color: #aaa;
}

#enableAlerts {
  margin-top: 24px;
  background: #f25549;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 17px 24px;
  font-size: 19px;
  font-weight: 800;
}

#enableAlerts.enabled {
  background: #198754;
}

.status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  gap: 12px;
}

#status {
  font-size: 22px;
  font-weight: 800;
  color: #9cff8c;
}

#count {
  font-size: 20px;
  color: #ddd;
  white-space: nowrap;
}

.refresh-text {
  color: #777;
  margin-top: 18px;
  font-size: 16px;
}

#errorBox {
  display: none;
  background: #3b1111;
  color: #ffb4ae;
  border: 1px solid #c0392b;
  margin: 18px;
  padding: 14px;
  border-radius: 8px;
  line-height: 1.4;
}

#incidents {
  padding: 16px 14px 60px;
}

.loading {
  text-align: center;
  color: #aaa;
  font-size: 24px;
  padding: 60px 20px;
}

.incident {
  background: #151515;
  border: 1px solid #303030;
  border-left: 5px solid #f05b50;
  border-radius: 10px;
  padding: 17px;
  margin-bottom: 14px;
}

.incident.high-priority {
  border-left-color: red;
  background: #1d1010;
}

.priority-label {
  display: inline-block;
  background: #d90000;
  color: white;
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 900;
  margin-bottom: 10px;
}

.incident-title {
  font-size: 21px;
  font-weight: 900;
  margin-bottom: 8px;
}

.incident-description {
  color: #ccc;
  font-size: 17px;
  margin-bottom: 14px;
  line-height: 1.4;
}

.incident-time {
  display: inline-block;
  background: #242424;
  color: #ffd86b;
  padding: 8px 11px;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 8px;
}

.incident-id {
  color: #777;
  font-size: 12px;
  margin-top: 7px;
}

.footer {
  text-align: center;
  color: #666;
  padding: 20px 20px 40px;
  font-size: 14px;
}

</style>
</head>

<body>

<div class="header">

  <h1>
    🚨 OKC BREAKING<br>
    NEWS<br>
    MONITOR
  </h1>

  <div class="subtitle">
    Oklahoma City Public Safety Incident Monitor
  </div>

  <button id="enableAlerts">
    🔊 ENABLE ALERTS
  </button>

  <div class="status-row">

    <div id="status">
      🟡 CONNECTING
    </div>

    <div id="count">
      0 incidents
    </div>

  </div>

  <div class="refresh-text">
    Automatically checks for new incidents every 30 seconds
  </div>

</div>

<div id="errorBox"></div>

<div id="incidents">

  <div class="loading">
    Loading OKC incidents...
  </div>

</div>

<div class="footer">
  Public safety information may change as incidents develop.
</div>

<script>

/* =========================================================
   FEED
========================================================= */

const BASE_URL =
  "https://utility.arcgis.com/usrsvcs/servers/01c97e2928134efc93157d99f2d23047/rest/services/OpenData/Public_Safety/FeatureServer/0/query";

const REFRESH_INTERVAL = 30000;


/* =========================================================
   STATE
========================================================= */

let alertsEnabled = false;
let firstLoad = true;
let knownIncidentIds = new Set();


/* =========================================================
   HIGH PRIORITY WORDS
========================================================= */

const HIGH_PRIORITY_WORDS = [
  "shooting",
  "shots fired",
  "structure fire",
  "house fire",
  "apartment fire",
  "commercial fire",
  "working fire",
  "explosion",
  "stabbing",
  "armed robbery",
  "robbery",
  "officer down",
  "officer involved",
  "pursuit",
  "barricaded",
  "hostage",
  "fatality",
  "dead body",
  "water rescue",
  "drowning",
  "aircraft",
  "plane crash",
  "train crash",
  "hazmat",
  "bomb",
  "active shooter"
];


/* =========================================================
   ELEMENTS
========================================================= */

const incidentsElement =
  document.getElementById("incidents");

const statusElement =
  document.getElementById("status");

const countElement =
  document.getElementById("count");

const errorBox =
  document.getElementById("errorBox");

const alertButton =
  document.getElementById("enableAlerts");


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   FIND RAW DATE/TIME FIELD
========================================================= */

function getIncidentDate(attributes) {
  const raw = attributes.Reported_Time;

  if (!raw) return null;

  const parsed = new Date(raw);

  if (isNaN(parsed.getTime())) {
    return null;
  }

  return parsed;
}

function formatIncidentDate(attributes) {
  const date = getIncidentDate(attributes);

  if (!date) {
    return "Date/time unavailable";
  }

  return date.toLocaleString("en-US", {
    month: "short",
    day: "numeric",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}

/* =========================================================
   TITLE
========================================================= */

function getTitle(attributes) {

  return (
    attributes.InfoTitle ||
    attributes.Call_Type ||
    attributes.CallType ||
    attributes.Description ||
    attributes.Type ||
    attributes.IncidentType ||
    "Public Safety Incident"
  );
}


/* =========================================================
   DESCRIPTION
========================================================= */

function getDescription(attributes) {

  const title =
    getTitle(attributes);

  const values = [
    attributes.Call_Type,
    attributes.Description,
    attributes.Info,
    attributes.Problem,
    attributes.Nature,
    attributes.Location,
    attributes.Address
  ];

  for (const value of values) {

    if (
      value &&
      String(value).trim() !== String(title).trim()
    ) {
      return String(value);
    }
  }

  return "";
}


/* =========================================================
   INCIDENT ID
========================================================= */

function getIncidentId(attributes) {

  return (
    attributes.ObjectID ??
    attributes.OBJECTID ??
    attributes.objectid ??
    attributes.ID ??
    JSON.stringify(attributes)
  );
}


/* =========================================================
   HIGH PRIORITY CHECK
========================================================= */

function isHighPriority(attributes) {

  const text =
    Object.values(attributes)
      .join(" ")
      .toLowerCase();

  return HIGH_PRIORITY_WORDS.some(
    word =>
      text.includes(
        word.toLowerCase()
      )
  );
}


/* =========================================================
   ALERT SOUND
========================================================= */

function playAlertSound() {

  if (!alertsEnabled) {
    return;
  }

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContext();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.type = "square";

    oscillator.frequency.setValueAtTime(
      880,
      audioContext.currentTime
    );

    oscillator.frequency.setValueAtTime(
      660,
      audioContext.currentTime + 0.2
    );

    oscillator.frequency.setValueAtTime(
      880,
      audioContext.currentTime + 0.4
    );

    gain.gain.setValueAtTime(
      0.15,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.01,
      audioContext.currentTime + 0.7
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.7
    );

  } catch (error) {

    console.log(
      "Audio error:",
      error
    );
  }
}


/* =========================================================
   ENABLE ALERT BUTTON
========================================================= */

alertButton.addEventListener(
  "click",
  function () {

    alertsEnabled = true;

    alertButton.textContent =
      "🔊 ALERTS ENABLED";

    alertButton.classList.add(
      "enabled"
    );

    playAlertSound();
  }
);


/* =========================================================
   CREATE INCIDENT CARD
========================================================= */

function createIncidentCard(feature) {

  const attributes =
    feature.attributes || {};

  const title =
    getTitle(attributes);

  const description =
    getDescription(attributes);

  const dateTime =
    getIncidentDateTime(attributes);

  const incidentId =
    getIncidentId(attributes);

  const priority =
    isHighPriority(attributes);

  const card =
    document.createElement("div");

  card.className =
    priority
      ? "incident high-priority"
      : "incident";

  let html = "";

  if (priority) {

    html +=
      '<div class="priority-label">🚨 HIGH PRIORITY</div>';
  }

  html +=
    '<div class="incident-title">' +
    escapeHTML(title) +
    '</div>';

  if (description) {

    html +=
      '<div class="incident-description">' +
      escapeHTML(description) +
      '</div>';
  }

  html +=
    '<div class="incident-time">🕒 ' +
    escapeHTML(dateTime) +
    '</div>';

  html +=
    '<div class="incident-id">Incident #' +
    escapeHTML(incidentId) +
    '</div>';

  card.innerHTML = html;

  return card;
}


/* =========================================================
   RENDER INCIDENTS
========================================================= */

function renderIncidents(features) {

  incidentsElement.innerHTML = "";

  if (
    !features ||
    features.length === 0
  ) {

    incidentsElement.innerHTML =
      '<div class="loading">No incidents returned.</div>';

    countElement.textContent =
      "0 incidents";

    return;
  }

  countElement.textContent =
    features.length +
    (
      features.length === 1
        ? " incident"
        : " incidents"
    );

  if (!firstLoad) {

    for (const feature of features) {

      const attributes =
        feature.attributes || {};

      const id =
        String(
          getIncidentId(attributes)
        );

      if (
        !knownIncidentIds.has(id) &&
        isHighPriority(attributes)
      ) {
        playAlertSound();
      }
    }
  }

  knownIncidentIds =
    new Set(
      features.map(
        feature =>
          String(
            getIncidentId(
              feature.attributes || {}
            )
          )
      )
    );

  for (const feature of features) {

    incidentsElement.appendChild(
      createIncidentCard(feature)
    );
  }

  firstLoad = false;
}


/* =========================================================
   LOAD INCIDENTS
========================================================= */

async function loadIncidents() {

  statusElement.textContent =
    "🟡 CONNECTING";

  errorBox.style.display =
    "none";

  try {

    const params =
      new URLSearchParams();

    params.set(
      "where",
      "1=1"
    );

    params.set(
      "outFields",
      "*"
    );

    params.set(
      "returnGeometry",
      "false"
    );

    params.set(
      "orderByFields",
      "ObjectID DESC"
    );

    params.set(
      "resultRecordCount",
      "100"
    );

    params.set(
      "f",
      "json"
    );

    const url =
      BASE_URL +
      "?" +
      params.toString();

    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status +
        " " +
        response.statusText
      );
    }

    const data =
      await response.json();

    if (data.error) {

      throw new Error(
        data.error.message ||
        "ArcGIS feed error"
      );
    }

    if (!Array.isArray(data.features)) {

      throw new Error(
        "The feed did not return a features array."
      );
    }


    /* =====================================================
       SORT BY ACTUAL INCIDENT DATE/TIME
       NEWEST FIRST
    ===================================================== */

    data.features.sort(
      function (a, b) {

        const timeA =
          getIncidentTimestamp(
            a.attributes || {}
          );

        const timeB =
          getIncidentTimestamp(
            b.attributes || {}
          );

        return timeB - timeA;
      }
    );


    renderIncidents(
      data.features
    );

    statusElement.textContent =
      "🟢 LIVE";

  } catch (error) {

    console.error(
      "Feed error:",
      error
    );

    statusElement.textContent =
      "🔴 FEED ERROR";

    incidentsElement.innerHTML =
      '<div class="loading">Unable to load OKC incidents.</div>';

    errorBox.style.display =
      "block";

    errorBox.innerHTML =
      "<strong>Feed error:</strong><br>" +
      escapeHTML(
        error.message
      );
  }
}


/* =========================================================
   START MONITOR
========================================================= */

loadIncidents();


/* =========================================================
   CHECK EVERY 30 SECONDS
========================================================= */

setInterval(
  loadIncidents,
  REFRESH_INTERVAL
);

</script>

</body>
</html>

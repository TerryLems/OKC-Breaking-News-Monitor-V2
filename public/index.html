<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#0b0b0b" />

  <title>OKC Breaking News Monitor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .header {
      background: #111111;
      padding: 28px 20px 24px;
      border-bottom: 3px solid #ef6a5b;
    }

    .title {
      margin: 0;
      color: #ff7366;
      font-size: 36px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 22px;
      color: #b7b7b7;
      font-size: 20px;
      line-height: 1.35;
    }

    .alert-button {
      margin-top: 26px;
      width: 100%;
      max-width: 475px;
      border: none;
      border-radius: 13px;
      background: #e86154;
      color: white;
      padding: 20px;
      font-size: 21px;
      font-weight: 900;
      cursor: pointer;
    }

    .status-row {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 900;
      color: #aaff95;
    }

    .status-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e33434;
      box-shadow: 0 0 4px rgba(255, 0, 0, 0.8);
      flex-shrink: 0;
    }

    .incident-count {
      color: #dddddd;
      font-size: 20px;
      white-space: nowrap;
    }

    .refresh-text {
      margin-top: 22px;
      color: #747474;
      font-size: 17px;
      line-height: 1.4;
    }

    .content {
      padding: 18px;
    }

    .error-box {
      display: none;
      background: #401615;
      border: 1px solid #de5547;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      color: #ffbeb7;
      font-size: 17px;
      line-height: 1.4;
    }

    .loading {
      text-align: center;
      color: #aaaaaa;
      font-size: 22px;
      padding: 60px 10px;
    }

    .incident-card {
      background: #151515;
      border: 1px solid #333333;
      border-left: 5px solid #ff6b5c;
      border-radius: 13px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.3);
    }

    .incident-top {
      padding: 16px 16px 12px;
      border-bottom: 1px solid #292929;
    }

    .incident-type {
      color: #ffffff;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
    }

    .incident-time {
      margin-top: 8px;
      color: #ffbf69;
      font-size: 16px;
      font-weight: 700;
    }

    .incident-body {
      padding: 14px 16px 17px;
    }

    .incident-description {
      color: #d9d9d9;
      font-size: 17px;
      line-height: 1.4;
    }

    .incident-location {
      color: #9f9f9f;
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.35;
    }

    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 9px;
      border-radius: 6px;
      background: #292929;
      color: #aaaaaa;
      font-size: 12px;
      font-weight: bold;
    }

    .footer {
      color: #555555;
      text-align: center;
      padding: 20px;
      font-size: 13px;
    }

    .priority-card-high {
  border-left: 7px solid #ff2d2d;
  background: #1c1111;
}

.priority-card-elevated {
  border-left: 7px solid #ff9f1c;
  background: #1a1710;
}

.priority-card-routine {
  border-left: 5px solid #777777;
}

.priority-badge {
  display: inline-block;
  margin-bottom: 10px;
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.5px;
}

.priority-high {
  background: #ff2d2d;
  color: #ffffff;
}

.priority-elevated {
  background: #ff9f1c;
  color: #111111;
}

.priority-routine {
  background: #333333;
  color: #aaaaaa;
}
  
  </style>
</head>

<body>

  <header class="header">

    <h1 class="title">
      🚨 OKC BREAKING<br />
      NEWS<br />
      MONITOR
    </h1>

    <div class="subtitle">
      Oklahoma City Public Safety Incident Monitor
    </div>

    <button
      id="enableAlertsButton"
      class="alert-button"
      onclick="enableAlerts()"
    >
      🔊 ENABLE ALERTS
    </button>

    <div class="status-row">

      <div id="status" class="status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">CONNECTING...</span>
      </div>

      <div id="incidentCount" class="incident-count">
        0 incidents
      </div>

    </div>

    <div class="refresh-text">
      Automatically checks for new incidents every 30 seconds
    </div>

  </header>


  <main class="content">

    <div id="errorBox" class="error-box"></div>

    <div id="incidentList">

      <div class="loading">
        Loading OKC incidents...
      </div>

    </div>

  </main>


  <div class="footer">
    Public safety information from Oklahoma City open data.
  </div>


<script>

/* =========================================================
   OKC BREAKING NEWS MONITOR
   CLEAN VERSION
   ========================================================= */


/* ---------------------------------------------------------
   OKC ARCGIS FEED
   --------------------------------------------------------- */

const FEED_URL =
  "https://utility.arcgis.com/usrsvcs/servers/01c97e2928134efc93157d99f2d23047/rest/services/OpenData/Public_Safety/FeatureServer/0/query";


/* ---------------------------------------------------------
   SETTINGS
   --------------------------------------------------------- */

const REFRESH_INTERVAL = 30000;

let previousIncidentIds = new Set();

let firstLoad = true;

let alertsEnabled = false;


/* ---------------------------------------------------------
   GET ATTRIBUTE VALUE
   This allows us to try several possible ArcGIS field names.
   --------------------------------------------------------- */

function getValue(attributes, possibleNames) {

  for (const name of possibleNames) {

    if (
      attributes[name] !== undefined &&
      attributes[name] !== null &&
      attributes[name] !== ""
    ) {
      return attributes[name];
    }

  }

  return null;
}


/* ---------------------------------------------------------
   GET INCIDENT ID
   --------------------------------------------------------- */

function getIncidentId(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "ObjectID",
    "OBJECTID",
    "objectid",
    "IncidentID",
    "Incident_ID"
  ]) || JSON.stringify(a);

}


/* ---------------------------------------------------------
   GET INCIDENT TYPE
   --------------------------------------------------------- */

function getIncidentType(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "InfoTitle",
    "Call_Type",
    "CallType",
    "IncidentType",
    "Incident_Type",
    "Type"
  ]) || "Public Safety Incident";

}


/* ---------------------------------------------------------
   GET INCIDENT DESCRIPTION
   --------------------------------------------------------- */

function getIncidentDescription(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "Call_Type",
    "Description",
    "CallDescription",
    "Call_Description",
    "IncidentDescription",
    "Incident_Description",
    "InfoTitle"
  ]) || "No additional description available.";

}


/* ---------------------------------------------------------
   GET LOCATION
   --------------------------------------------------------- */

function getIncidentLocation(feature) {

  const a = feature.attributes || {};

  return getValue(a, [
    "Location",
    "Address",
    "IncidentLocation",
    "Incident_Location",
    "Street",
    "Block",
    "CrossStreet",
    "Cross_Street"
  ]);

}


/* ---------------------------------------------------------
   FIND INCIDENT DATE/TIME
   THIS FUNCTION WAS MISSING BEFORE.
   --------------------------------------------------------- */

function getIncidentTimestamp(feature) {

  const a = feature.attributes || {};

  const value = a.Reported_Time;

  if (!value) {
    return 0;
  }

  // Example from OKC:
  // Sep 28 2026  4:02PM

  const text = String(value)
    .replace(/\s+/g, " ")
    .trim();

  const match = text.match(
    /^([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i
  );

  if (!match) {
    console.log("Could not read Reported_Time:", value);
    return 0;
  }

  const months = {
    Jan: 0,
    Feb: 1,
    Mar: 2,
    Apr: 3,
    May: 4,
    Jun: 5,
    Jul: 6,
    Aug: 7,
    Sep: 8,
    Oct: 9,
    Nov: 10,
    Dec: 11
  };

  const monthName =
    match[1].charAt(0).toUpperCase() +
    match[1].slice(1).toLowerCase();

  const month = months[monthName];
  const day = Number(match[2]);
  const year = Number(match[3]);

  let hour = Number(match[4]);
  const minute = Number(match[5]);

  const ampm = match[6].toUpperCase();

  if (ampm === "PM" && hour !== 12) {
    hour += 12;
  }

  if (ampm === "AM" && hour === 12) {
    hour = 0;
  }

  const date = new Date(
    year,
    month,
    day,
    hour,
    minute,
    0,
    0
  );

  return date.getTime();
}


/* ---------------------------------------------------------
   FORMAT DATE/TIME
   --------------------------------------------------------- */

function formatIncidentDate(timestamp) {

  if (!timestamp) {
    return "Date/time unavailable";
  }

  const date = new Date(timestamp);

  return date.toLocaleString("en-US", {
    weekday: "short",
    month: "short",
    day: "numeric",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });

}


/* ---------------------------------------------------------
   ESCAPE HTML
   Prevents text from the feed from breaking the page.
   --------------------------------------------------------- */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ---------------------------------------------------------
   PRIORITY INCIDENT CHECK
   --------------------------------------------------------- */

function getPriorityLevel(feature) {

  const text =
    (
      getIncidentType(feature) +
      " " +
      getIncidentDescription(feature)
    ).toLowerCase();


  const highPriorityWords = [
    "shooting",
    "shots fired",
    "stabbing",
    "structure fire",
    "house fire",
    "apartment fire",
    "commercial fire",
    "explosion",
    "armed subject",
    "armed robbery",
    "homicide",
    "officer down",
    "officer involved",
    "person shot",
    "person stabbed"
  ];


  const elevatedWords = [
    "injury accident",
    "major accident",
    "major crash",
    "vehicle fire",
    "rescue",
    "traffic/trans. acc. fr",
    "traffic accident with injury"
  ];


  if (
    highPriorityWords.some(word =>
      text.includes(word)
    )
  ) {
    return "high";
  }


  if (
    elevatedWords.some(word =>
      text.includes(word)
    )
  ) {
    return "elevated";
  }


  return "routine";
  );

}


/* ---------------------------------------------------------
   ALERT SOUND
   --------------------------------------------------------- */

function playAlertSound() {

  if (!alertsEnabled) {
    return;
  }

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioContextClass();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.frequency.value = 880;

    oscillator.type = "sine";

    gain.gain.setValueAtTime(
      0.15,
      audioContext.currentTime
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.35
    );

  } catch (error) {

    console.log(
      "Unable to play alert:",
      error
    );

  }

}


/* ---------------------------------------------------------
   ENABLE ALERTS BUTTON
   --------------------------------------------------------- */

function enableAlerts() {

  alertsEnabled = true;

  const button =
    document.getElementById(
      "enableAlertsButton"
    );

  button.innerHTML =
    "🔊 ALERTS ENABLED";

  button.style.background =
    "#278f4b";

  /*
    Play a short test sound.
  */

  playAlertSound();

}


/* ---------------------------------------------------------
   UPDATE STATUS
   --------------------------------------------------------- */

function setStatus(type) {

  const statusText =
    document.getElementById(
      "statusText"
    );

  const dot =
    document.getElementById(
      "statusDot"
    );


  if (type === "live") {

    statusText.textContent =
      "LIVE";

    statusText.style.color =
      "#aaff95";

    dot.style.background =
      "#34c759";

  }


  if (type === "loading") {

    statusText.textContent =
      "CHECKING...";

    statusText.style.color =
      "#ffcf66";

    dot.style.background =
      "#ffb020";

  }


  if (type === "error") {

    statusText.textContent =
      "FEED ERROR";

    statusText.style.color =
      "#ff8d84";

    dot.style.background =
      "#e33434";

  }

}


/* ---------------------------------------------------------
   SHOW ERROR
   --------------------------------------------------------- */

function showError(message) {

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display =
    "block";

  box.innerHTML =
    "<strong>Feed error:</strong><br>" +
    escapeHTML(message);

}


/* ---------------------------------------------------------
   HIDE ERROR
   --------------------------------------------------------- */

function hideError() {

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display =
    "none";

  box.innerHTML =
    "";

}


/* ---------------------------------------------------------
   BUILD INCIDENT CARD
   --------------------------------------------------------- */

function createIncidentCard(feature) {

  const type =
    getIncidentType(feature);

  const description =
    getIncidentDescription(feature);

  const location =
    getIncidentLocation(feature);

  const timestamp =
    getIncidentTimestamp(feature);

  const formattedTime =
    formatIncidentDate(timestamp);

  const priority =
    getPriorityLevel(feature);


  let priorityBadge = "";
  let priorityClass = "";


  if (priority === "high") {

    priorityBadge =
      '<div class="priority-badge priority-high">' +
      "🚨 HIGH PRIORITY" +
      "</div>";

    priorityClass =
      "priority-card-high";

  }


  else if (priority === "elevated") {

    priorityBadge =
      '<div class="priority-badge priority-elevated">' +
      "⚠️ ELEVATED" +
      "</div>";

    priorityClass =
      "priority-card-elevated";

  }


  else {

    priorityBadge =
      '<div class="priority-badge priority-routine">' +
      "ROUTINE" +
      "</div>";

    priorityClass =
      "priority-card-routine";

  }


  let locationHTML = "";

  if (location) {

    locationHTML =
      '<div class="incident-location">' +
      "📍 " +
      escapeHTML(location) +
      "</div>";

  }


  return `

    <div class="incident-card ${priorityClass}">

      <div class="incident-top">

        ${priorityBadge}

        <div class="incident-type">
          ${escapeHTML(type)}
        </div>

        <div class="incident-time">
          🕒 ${escapeHTML(formattedTime)}
        </div>

      </div>

      <div class="incident-body">

        <div class="incident-description">
          ${escapeHTML(description)}
        </div>

        ${locationHTML}

      </div>

    </div>

  `;

}


/* ---------------------------------------------------------
   RENDER INCIDENTS

   IMPORTANT:
   Sort by REAL incident date/time.
   Newest incident appears FIRST.
   --------------------------------------------------------- */

function renderIncidents(features) {

  const container =
    document.getElementById("incidentList");

  features.sort((a, b) => {
    return (
      getIncidentTimestamp(b) -
      getIncidentTimestamp(a)
    );
  });

  document.getElementById(
    "incidentCount"
  ).textContent =
    features.length +
    (features.length === 1
      ? " incident"
      : " incidents");

  if (features.length === 0) {

    container.innerHTML =
      '<div class="loading">' +
      "No incidents currently available." +
      "</div>";

    return;
  }

  let html = "";

  features.forEach((feature, index) => {

    let card =
      createIncidentCard(feature);

    if (index === 0) {

      card = card.replace(
        '<div class="incident-type">',
        '<div style="margin-bottom:8px;">' +
        '<span style="' +
        'display:inline-block;' +
        'background:#ff5b4d;' +
        'color:white;' +
        'font-size:12px;' +
        'font-weight:900;' +
        'padding:5px 8px;' +
        'border-radius:5px;' +
        'letter-spacing:.5px;' +
        '">' +
        '🔥 NEWEST' +
        '</span>' +
        '</div>' +
        '<div class="incident-type">'
      );
    }

    html += card;
  });

  container.innerHTML = html;

}


/* ---------------------------------------------------------
   CHECK FOR NEW HIGH PRIORITY INCIDENTS
   --------------------------------------------------------- */

function checkForAlerts(features) {

  const currentIds =
    new Set();


  features.forEach(feature => {

    const id =
      String(
        getIncidentId(feature)
      );

    currentIds.add(id);


    if (
      !firstLoad &&
      !previousIncidentIds.has(id) &&
      isHighPriority(feature)
    ) {

      playAlertSound();

    }

  });


  previousIncidentIds =
    currentIds;

  firstLoad =
    false;

}


/* ---------------------------------------------------------
   LOAD OKC INCIDENT FEED
   --------------------------------------------------------- */

async function loadIncidents() {

  setStatus("loading");


  const params =
    new URLSearchParams({

      where: "1=1",

      outFields: "*",

      returnGeometry: "false",

      f: "json",

      resultRecordCount: "100",

      orderByFields:
        "ObjectID DESC"

    });


  const requestURL =
    FEED_URL +
    "?" +
    params.toString();


  try {

    const response =
      await fetch(
        requestURL,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "OKC server returned HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
      ArcGIS sometimes returns a valid HTTP response
      containing an error object.
    */

    if (data.error) {

      throw new Error(
        data.error.message ||
        "ArcGIS returned an error."
      );

    }


    if (
      !data.features ||
      !Array.isArray(data.features)
    ) {

      throw new Error(
        "The OKC feed did not return incident records."
      );

    }


    hideError();

    checkForAlerts(
      data.features
    );

    renderIncidents(
      data.features
    );

    setStatus("live");


  } catch (error) {

    console.error(
      "Feed error:",
      error
    );

    setStatus("error");

    showError(
      error.message
    );


    document.getElementById(
      "incidentList"
    ).innerHTML =
      '<div class="loading">' +
      "Unable to load OKC incidents." +
      "</div>";

  }

}


/* ---------------------------------------------------------
   START MONITOR
   --------------------------------------------------------- */

loadIncidents();


/* ---------------------------------------------------------
   CHECK EVERY 30 SECONDS
   --------------------------------------------------------- */

setInterval(
  loadIncidents,
  REFRESH_INTERVAL
);

</script>

</body>
</html>
